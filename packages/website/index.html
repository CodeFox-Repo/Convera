<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convera — AI Desktop Assistant</title>
    <meta
      name="description"
      content="Convera is a desktop AI agent workspace — conversations, agents and model configs stored locally on your machine, with search, branching, and Model Context Protocol (MCP) tools."
    />
    <meta name="author" content="convera" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- jsdelivr CDN optimizations for better performance -->
    <script
      async
      src="https://cdn.jsdelivr.net/npm/intersection-observer@0.12.2/intersection-observer.js"
    ></script>

    <!-- Video.js for enhanced video support (optional fallback) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.6.1/dist/video-js.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
