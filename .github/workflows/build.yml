name: Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install macOS dependencies
        run: |
          # Ensure Xcode command line tools are available
          xcode-select --install 2>/dev/null || true

      # Cache dependencies
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: packages/app
        run: pnpm test

      - name: Build and package app
        working-directory: packages/app
        run: |
          set -euo pipefail
          mkdir -p .automation/build-check
          pnpm run package 2>&1 | tee .automation/build-check/package.log
          # Forge can return zero after a Vite subprocess runs out of memory.
          ! grep -E 'FATAL ERROR|heap out of memory' .automation/build-check/package.log
          test -s .vite/build/main.js
          test -s .vite/build/preload.js
          test -s .vite/renderer/main_window/index.html
          test -n "$(find out -type d -name 'Convera.app' -print -quit)"

      - name: Make distribution files
        working-directory: packages/app
        run: |
          set -euo pipefail
          # Package was verified above; do not silently build it a second time.
          pnpm exec electron-forge make --skip-package 2>&1 | tee .automation/build-check/make.log
          ! grep -E 'FATAL ERROR|heap out of memory' .automation/build-check/make.log
          test -n "$(find out/make -type f -name '*.dmg' -size +0c -print -quit)"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convera-build-check-logs
          path: packages/app/.automation/build-check
          if-no-files-found: warn
