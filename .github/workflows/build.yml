name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install macOS dependencies
        run: |
          # Ensure Xcode command line tools are available
          xcode-select --install 2>/dev/null || true

      # Cache dependencies
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Set CI environment variable to skip robotjs rebuild during postinstall
      - name: Rebuild robotjs for CI
        working-directory: packages/app
        run: |
          export CI=false
          pnpm run rebuild:robotjs

      - name: Run tests
        working-directory: packages/app
        run: pnpm test

      - name: Build and package app
        working-directory: packages/app
        run: pnpm run package

      - name: Make distribution files
        working-directory: packages/app
        run: pnpm run make
