name: Sync Release to Public MacOS

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to sync (leave empty for latest)"
        required: false
        type: string
      force_recreate:
        description: "Force recreate release if exists"
        required: false
        type: boolean
        default: false

jobs:
  build-and-sync-to-homebrew:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Checkout code at specific tag
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      # Get version information
      - name: Get version information
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            # Use specified tag
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            echo "🏷️ Using specified tag: $TAG_NAME"
          else
            # Get latest release tag
            echo "🔍 Getting latest release tag..."
            TAG_NAME=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              jq -r '.tag_name')
            
            if [ "$TAG_NAME" = "null" ] || [ -z "$TAG_NAME" ]; then
              echo "❌ No release found, using current commit"
              TAG_NAME="v$(date +%Y%m%d%H%M%S)"
            else
              echo "🏷️ Latest release tag: $TAG_NAME"
            fi
          fi

          # Remove 'v' prefix for version
          VERSION=${TAG_NAME#v}
          echo "📦 Version: $VERSION"
          echo "🏷️ Tag: $TAG_NAME"

          # Get release information if tag exists
          if [ "$TAG_NAME" != "v$(date +%Y%m%d%H%M%S)" ]; then
            echo "📋 Getting release information..."
            RELEASE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME")
            
            RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name // "Convera '$VERSION'"')
            RELEASE_BODY=$(echo "$RELEASE_INFO" | jq -r '.body // "No release notes available"')
            
            echo "📝 Release Name: $RELEASE_NAME"
            echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT
            echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NAME=Convera $VERSION" >> $GITHUB_OUTPUT
            echo "RELEASE_BODY=Development build" >> $GITHUB_OUTPUT
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Install macOS dependencies for robotjs
      - name: Install macOS dependencies
        run: |
          xcode-select --install 2>/dev/null || true
          brew install python@3.11
          npm install -g node-gyp

      # Cache dependencies
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean and rebuild robotjs for release environment
      - name: Clean and rebuild robotjs for release
        working-directory: app
        run: |
          export CI=false
          rm -rf node_modules/@hurdlegroup/robotjs/build
          pnpm run rebuild:robotjs

      # Build the app
      - name: Build and package app
        working-directory: app
        run: pnpm run make:robotjs

      # Find and verify the DMG file
      - name: Find and verify DMG file
        id: find_dmg
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          echo "🔍 Looking for DMG file..."
          DMG_PATH=$(find app/out/make -name "*.dmg" | head -1)

          if [ -z "$DMG_PATH" ]; then
            echo "❌ No DMG file found"
            echo "Available files:"
            find app/out -name "*" -type f
            exit 1
          fi

          echo "📦 Found DMG: $DMG_PATH"

          # Check file size
          FILE_SIZE=$(stat -f%z "$DMG_PATH")
          echo "📦 DMG file size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ DMG file appears to be too small (less than 1MB)"
            exit 1
          fi

          # Calculate SHA256
          DMG_SHA=$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)
          echo "✅ DMG SHA256: $DMG_SHA"

          # Copy to expected location
          cp "$DMG_PATH" "Convera-${VERSION}-arm64.dmg"

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG_SHA=$DMG_SHA" >> $GITHUB_ENV

      # Create release in homebrew repository
      - name: Create release in homebrew repository
        env:
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          RELEASE_NAME: ${{ steps.get_version.outputs.RELEASE_NAME }}
          RELEASE_BODY: ${{ steps.get_version.outputs.RELEASE_BODY }}
        run: |
          # Check if we have the required token
          if [ -z "${{ secrets.REPO_ACCESS_TOKEN }}" ]; then
            echo "❌ REPO_ACCESS_TOKEN not available"
            echo "Please set up REPO_ACCESS_TOKEN secret with access to homebrew-codefox repository"
            exit 1
          fi

          echo "🚀 Creating release in homebrew repository..."

          # Check if release already exists and force recreate if requested
          if [ "${{ github.event.inputs.force_recreate }}" = "true" ]; then
            echo "🔄 Force recreate enabled - deleting existing release if it exists..."
            curl -X DELETE \
              -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/CodeFox-Repo/homebrew-codefox/releases/tags/$TAG_NAME" 2>/dev/null || true
          fi

          # Create release using GitHub API with properly escaped JSON using jq
          RELEASE_BODY_TEXT="Convera version $VERSION - Built and synced from main repository\n\n**Source Repository:** https://github.com/CodeFox-Repo/convera/tree/$TAG_NAME\n**Download:** Direct from homebrew repository for faster and more reliable distribution."

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY_TEXT" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false
            }' > release_data.json

          echo "📋 Release data:"
          cat release_data.json

          # Create the release
          RELEASE_RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/CodeFox-Repo/homebrew-codefox/releases" \
            -d @release_data.json)

          # Extract upload URL
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')

          if [ "$UPLOAD_URL" = "null" ]; then
            echo "❌ Failed to create release or release already exists"
            echo "Response: $RELEASE_RESPONSE"
            
            # Check if release already exists
            EXISTING_RELEASE=$(curl -s \
              -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/CodeFox-Repo/homebrew-codefox/releases/tags/$TAG_NAME")
            
            UPLOAD_URL=$(echo "$EXISTING_RELEASE" | jq -r '.upload_url' | sed 's/{?name,label}//')
            
            if [ "$UPLOAD_URL" = "null" ]; then
              echo "❌ Could not get upload URL from existing release"
              echo "💡 Try enabling 'Force recreate release' option to recreate the release"
              exit 1
            else
              echo "✅ Using existing release"
              # Delete existing assets first
              echo "🗑️ Deleting existing assets..."
              ASSETS=$(echo "$EXISTING_RELEASE" | jq -r '.assets[]?.id // empty')
              for asset_id in $ASSETS; do
                if [ -n "$asset_id" ]; then
                  curl -X DELETE \
                    -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/CodeFox-Repo/homebrew-codefox/releases/assets/$asset_id" || true
                fi
              done
            fi
          else
            echo "✅ Successfully created release"
          fi

          echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV

      # Upload DMG to homebrew repository release
      - name: Upload DMG to homebrew repository
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          echo "📤 Uploading DMG to homebrew repository release..."

          # Check if DMG file exists and get file size
          if [ ! -f "Convera-${VERSION}-arm64.dmg" ]; then
            echo "❌ DMG file not found!"
            exit 1
          fi

          FILE_SIZE=$(stat -f%z "Convera-${VERSION}-arm64.dmg")
          echo "📦 DMG file size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ DMG file appears to be too small (less than 1MB)"
            exit 1
          fi

          # Upload the DMG file with proper error handling
          UPLOAD_RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"Convera-${VERSION}-arm64.dmg" \
            -w "%{http_code}" \
            -o upload_response.json \
            "${UPLOAD_URL}?name=Convera-${VERSION}-arm64.dmg&label=Convera-${VERSION}-arm64.dmg")

          echo "📊 Upload HTTP status: $UPLOAD_RESPONSE"

          if [ "$UPLOAD_RESPONSE" -eq 201 ]; then
            echo "✅ Successfully uploaded DMG"
            cat upload_response.json
          else
            echo "❌ Failed to upload DMG - HTTP status: $UPLOAD_RESPONSE"
            echo "Response:"
            cat upload_response.json
            exit 1
          fi

      # Update Homebrew formula to point to homebrew repository
      - name: Update Homebrew formula
        env:
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          RELEASE_NAME: ${{ steps.get_version.outputs.RELEASE_NAME }}
        run: |
          echo "🍺 Updating Homebrew formula to point to homebrew repository..."

          # Clone Homebrew repository with the correct token
          echo "📦 Cloning Homebrew repository..."
          git clone https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/CodeFox-Repo/homebrew-codefox.git
          cd homebrew-codefox

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          # Create or update formula file (pointing to homebrew repository)
          echo "📝 Creating Homebrew formula..."
          cat > Formula/convera.rb << EOF
          cask "convera" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"
            
            url "https://github.com/CodeFox-Repo/homebrew-codefox/releases/download/${TAG_NAME}/Convera-#{version}-arm64.dmg"
            name "Convera"
            desc "All in one Chat App"
            homepage "https://github.com/CodeFox-Repo/convera"
            
            app "Convera.app"
            
            zap trash: [
              "~/Library/Application Support/Convera",
              "~/Library/Preferences/com.codefox-convera.plist",
              "~/Library/Saved Application State/com.codefox-convera.savedState",
              "~/Library/Logs/Convera"
            ]
          end
          EOF

          # Commit and push changes
          echo "🚀 Committing and pushing changes..."
          git config user.name "Sma1lboy"
          git config user.email "541898146chen@gmail.com"
          git add Formula/convera.rb

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "📋 No changes to commit - formula is already up to date"
          else
            git commit -m "Update Convera to version ${VERSION} - ${RELEASE_NAME}

            Release: ${TAG_NAME}
            Source: https://github.com/CodeFox-Repo/convera/tree/${TAG_NAME}
            Homebrew Release: https://github.com/CodeFox-Repo/homebrew-codefox/releases/tag/${TAG_NAME}
            
            Auto-synced by GitHub Actions"
            git push
            echo "✅ Successfully updated Homebrew formula to version ${VERSION}"
          fi
