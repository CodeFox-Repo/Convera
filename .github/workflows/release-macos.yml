name: Release macOS App

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      # Install dependencies with yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run tests
      - name: Run tests
        run: yarn test

      # Package the app for distribution
      - name: Package app
        run: yarn package

      # Make distributable
      - name: Make app distributable
        run: yarn make

      # Get version from tag
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*.dmg
            out/make/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update Homebrew formula
      - name: Update Homebrew formula
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          # Clone Homebrew repository
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/CodeFox-Repo/homebrew-codefox.git
          cd homebrew-codefox
          
          # Create Formula directory if it doesn't exist
          mkdir -p Formula
          
          # Get DMG URL and calculate SHA
          DMG_URL="https://github.com/CodeFox-Repo/foxychat/releases/download/v${VERSION}/FoxyChat-${VERSION}-arm64.dmg"
          DMG_SHA=$(curl -sL "$DMG_URL" | shasum -a 256 | cut -d' ' -f1)
          
          # Create or update formula file
          cat > Formula/foxychat.rb << EOF
          cask "foxychat" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"
            
            url "https://github.com/CodeFox-Repo/Foxychat/releases/download/v#{version}/FoxyChat-#{version}-arm64.dmg"
            name "FoxyChat"
            desc "All in one Chat App"
            homepage "https://github.com/CodeFox-Repo/foxychat"
            
            app "FoxyChat.app"
            
            zap trash: [
              "~/Library/Application Support/FoxyChat",
              "~/Library/Preferences/com.codefox-foxychat.plist",
              "~/Library/Saved Application State/com.codefox-foxychat.savedState",
              "~/Library/Logs/FoxyChat"
            ]
          end
          EOF
          
          # Commit and push changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/foxychat.rb
          git commit -m "Update FoxyChat to version ${VERSION}"
          git push 