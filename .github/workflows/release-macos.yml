name: Release macOS App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # This is required for creating releases
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Install macOS dependencies for robotjs
      - name: Install macOS dependencies
        run: |
          # Ensure Xcode command line tools are available
          xcode-select --install 2>/dev/null || true
          # Install Python for node-gyp (robotjs compilation)
          brew install python@3.11
          # Install additional build tools
          npm install -g node-gyp

      # Cache dependencies
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install dependencies with pnpm from workspace root
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean and rebuild robotjs for release environment
      - name: Clean and rebuild robotjs for release
        working-directory: app
        run: |
          # Set environment for native compilation
          export CI=false

          # Clean any existing builds
          rm -rf node_modules/@hurdlegroup/robotjs/build

          # Force rebuild robotjs with proper electron ABI
          pnpm run rebuild:robotjs

      # Run tests
      - name: Run tests
        working-directory: app
        run: pnpm test

      # Make app distributable (this will also package)
      - name: Make app distributable with robotjs
        working-directory: app
        run: pnpm run make:robotjs

      # Get version from tag
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/out/make/**/*.dmg
            app/out/make/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

