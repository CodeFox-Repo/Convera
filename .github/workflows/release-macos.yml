name: Release macOS App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # This is required for creating releases
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Cache dependencies
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install dependencies with pnpm from workspace root
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run tests
      - name: Run tests
        working-directory: packages/app
        run: pnpm test

      # Make app distributable (this will also package)
      - name: Make app distributable
        working-directory: packages/app
        env:
          # The renderer bundle OOMs Node's default ~2GB heap on the runner.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run make

      # Get version from tag
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # A release with zero artifacts must fail loudly, not ship a tag
          # with nothing attached — that already happened once.
          fail_on_unmatched_files: true
          files: |
            packages/app/out/make/**/*.dmg
            packages/app/out/make/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

